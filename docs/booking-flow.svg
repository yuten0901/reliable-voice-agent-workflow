<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title description">
  <title id="title">Voice booking workflow and safe failure paths</title>
  <desc id="description">A local fixture passes through speech recognition and a voice agent. Successful calendar writes lead to confirmation and idempotent CRM update. Recognition and calendar failures lead to human callback.</desc>
  <defs>
    <style>
      .background { fill: #f8fafc; }
      .node { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 14; }
      .safe { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 14; }
      .fallback { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
      .label { fill: #0f172a; font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .success-edge { fill: none; stroke: #047857; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .failure-edge { fill: none; stroke: #c2410c; stroke-width: 2.5; marker-end: url(#arrow-orange); }
      .edge-label { fill: #475569; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker>
  </defs>
  <rect class="background" width="1120" height="480" rx="18"/>
  <text x="560" y="42" class="label" style="font-size:22px">Offline booking workflow: commit first, confirm second</text>

  <rect class="node" x="35" y="125" width="170" height="88"/>
  <text x="120" y="159" class="label">Call fixture</text>
  <text x="120" y="183" class="small">synthetic transcript</text>

  <rect class="node" x="260" y="125" width="170" height="88"/>
  <text x="345" y="159" class="label">STT boundary</text>
  <text x="345" y="183" class="small">confidence gate</text>

  <rect class="node" x="485" y="125" width="170" height="88"/>
  <text x="570" y="159" class="label">Voice agent</text>
  <text x="570" y="183" class="small">checkpointed state</text>

  <rect class="node" x="710" y="125" width="170" height="88"/>
  <text x="795" y="159" class="label">Calendar write</text>
  <text x="795" y="183" class="small">stable operation ID</text>

  <rect class="safe" x="935" y="85" width="150" height="88"/>
  <text x="1010" y="119" class="label">Confirm</text>
  <text x="1010" y="143" class="small">only after commit</text>

  <rect class="safe" x="935" y="215" width="150" height="88"/>
  <text x="1010" y="249" class="label">CRM upsert</text>
  <text x="1010" y="273" class="small">idempotent replay</text>

  <rect class="fallback" x="485" y="345" width="310" height="88"/>
  <text x="640" y="379" class="label">Human callback</text>
  <text x="640" y="403" class="small">no guessed data or false booking</text>

  <path class="edge" d="M205 169 H260"/>
  <path class="edge" d="M430 169 H485"/>
  <path class="edge" d="M655 169 H710"/>
  <path class="success-edge" d="M880 149 H935"/>
  <path class="success-edge" d="M880 188 C910 188 910 259 935 259"/>
  <path class="failure-edge" d="M345 213 V300 C345 330 440 389 485 389"/>
  <path class="failure-edge" d="M795 213 V300 C795 330 760 355 745 365"/>

  <text x="907" y="126" class="edge-label">success</text>
  <text x="377" y="287" class="edge-label">recognition limit</text>
  <text x="785" y="287" class="edge-label">bounded retry exhausted</text>
</svg>
